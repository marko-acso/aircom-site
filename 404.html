<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page Not Found — Aircom Ltd.</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0F1A24;
            color: #E8ECF0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 2rem;
            text-align: center;
        }
        .wrap { max-width: 520px; }
        h1 { font-size: 4rem; margin: 0 0 0.5rem; color: #2E6B8A; }
        h2 { font-size: 1.5rem; margin: 0 0 1rem; font-weight: 500; }
        p { color: #9AA5B0; margin-bottom: 2rem; line-height: 1.6; }
        a {
            display: inline-block;
            padding: 0.75rem 1.75rem;
            background: #2E6B8A;
            color: #FAFBFC;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.2s;
        }
        a:hover { background: #245A74; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>404</h1>
        <h2>Page not found</h2>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="/">Back to Aircom home</a>
    </div>
</body>
</html>
